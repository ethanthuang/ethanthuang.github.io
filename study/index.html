<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f7f6f3; color: #1a1a18; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

  /* Header */
  .header { background: #1a1a18; color: #f7f6f3; padding: 22px 24px 18px; }
  .header h1 { font-size: 19px; font-weight: 600; letter-spacing: -0.4px; }
  .header p { font-size: 12px; color: #888; margin-top: 4px; }

  /* Content */
  .main { max-width: 760px; margin: 0 auto; padding: 16px 16px 60px; display: flex; flex-direction: column; gap: 9px; }
  .card { background: #fff; border-radius: 11px; border: 1px solid #e8e7e4; padding: 14px 16px; }
  .card h2 { font-size: 13px; font-weight: 600; letter-spacing: -0.2px; }
  .card p { font-size: 12.5px; color: #8a8a86; margin-top: 4px; }
</style>
</head>
<body>
  <div class="header">
    <h1>Study</h1>
    <p>Notes and resources</p>
  </div>
  <div class="main">
    <div class="card">
      <h2>Coming soon</h2>
      <p>Content for this page hasn't been added yet.</p>
    </div>
  </div>
</body>
</html>
